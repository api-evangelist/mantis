name: Mantis
description: >-
  Mantis (Mantis Biotech) builds predictive digital twins of individual people,
  aggregating personal data streams — wearables, digital activity, and clinical
  records — into high-fidelity models by combining large language models with
  physics-based simulation. The company positions itself as a neutral
  intermediary for personal predictive models — an "OAuth for identity" or
  "Plaid for banking" layer — letting individuals grant scoped, revocable access
  to their twin to healthcare providers and third-party builders. Applications
  include pre-symptomatic infection detection, cognitive baseline monitoring,
  heart-failure decompensation forecasting, medication-adherence prediction,
  post-operative recovery trajectories, psychiatric relapse early warning, and
  running trials on twins. Mantis is a Y Combinator (Winter 2026) company; as of
  this profile it publishes a marketing site and manifesto but no public API,
  developer portal, or SDKs.
